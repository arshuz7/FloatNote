name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          ./build.sh --universal

      - name: Zip app
        run: ditto -c -k --keepParent FloatNote.app FloatNote.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatNote
          path: FloatNote.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FloatNote.zip
          generate_release_notes: true
